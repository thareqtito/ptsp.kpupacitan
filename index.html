header{flex:0 0 auto;display:flex;align-items:center;gap:2vw;padding:1.6vh 3vw;background:linear-gradient(90deg,rgba(120,20,4,.94),rgba(232,52,20,.9));border-bottom:3px solid var(--gold);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.3);}
.logo{height:8.5vh;width:auto;flex:0 0 auto;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4));}
.title-wrap{flex:1;min-width:0;}
.title-wrap h1{margin:0;font-size:clamp(17px,2.8vh,30px);font-weight:800;line-height:1.25;text-shadow:0 2px 5px rgba(0,0,0,.4);}
.title-wrap span{display:block;font-weight:600;font-size:0.78em;color:var(--gold);margin-top:2px;}
.header-controls{display:flex;gap:8px;flex:0 0 auto;}
.hbtn{background:rgba(255,255,255,.18);border:1px solid var(--gold);color:#fff;padding:10px 16px;border-radius:999px;cursor:pointer;font-size:clamp(12px,1.5vh,15px);font-weight:700;white-space:nowrap;}
.hbtn.active{background:var(--gold);color:#4a1e00;}
main#grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:2.2vh 1.8vw;padding:2.6vh 3vw;min-height:0;}
main#grid.rows5{grid-template-columns:repeat(5,1fr);}
main#grid.staffgrid{grid-template-columns:repeat(3,1fr);grid-template-rows:1fr;max-width:1100px;margin:0 auto;width:100%;}
.tile{background:var(--card);border:none;border-radius:var(--radius);box-shadow:0 6px 18px rgba(0,0,0,.28);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2vh;cursor:pointer;position:relative;color:var(--text);padding:1vh;transition:transform .14s,box-shadow .14s;border-top:4px solid var(--tile-color,var(--navy));}
.tile:hover,.tile:focus-visible{transform:translateY(-5px) scale(1.02);box-shadow:0 14px 28px rgba(0,0,0,.32);outline:3px solid var(--red);}
.icon-wrap{width:10vh;height:10vh;max-width:76px;max-height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--tile-tint,rgba(224,123,0,.16));box-shadow:0 3px 10px rgba(0,0,0,.15);overflow:hidden;}
.tile .icon{font-size:clamp(28px,4.6vh,40px);}
.tile-icon-img{width:78%;height:78%;object-fit:contain;border-radius:50%;}
.tile .label{font-size:clamp(15px,2.2vh,20px);font-weight:800;text-align:center;padding:0 6px;line-height:1.28;}
.speak-btn{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.08);border:none;border-radius:50%;width:26px;height:26px;font-size:13px;cursor:pointer;color:inherit;}
footer{flex:0 0 auto;text-align:center;font-size:clamp(11px,1.4vh,14px);font-weight:600;color:#ffe6c7;padding:.7vh 0;text-shadow:0 1px 3px rgba(0,0,0,.6);}
#overlay{position:fixed;inset:0;background:rgba(5,10,20,.68);display:flex;align-items:center;justify-content:center;z-index:50;padding:3vh 3vw;}
#overlay.hidden{display:none;}
#modalBox{background:var(--card);color:var(--text);border-radius:20px;padding:3vh 3vw;max-width:90vw;max-height:90vh;width:90vw;overflow-y:auto;position:relative;min-width:320px;box-shadow:0 24px 60px rgba(0,0,0,.4);}
#modalClose{position:absolute;top:10px;right:14px;background:rgba(0,0,0,.08);border:none;border-radius:50%;width:34px;height:34px;font-size:22px;cursor:pointer;color:var(--text);line-height:1;}
#modalTitle{margin:0 50px 2.2vh 0;font-size:clamp(22px,3.4vh,32px);font-weight:800;color:var(--red);}
:root[data-theme="dark"] #modalTitle{color:var(--gold);}
.subgrid{display:grid;gap:2.6vh 2vw;}
.subtile{background:linear-gradient(160deg,var(--card),var(--bg));border:none;border-top:5px solid var(--gold);border-radius:18px;box-shadow:0 6px 16px rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4vh;padding:3vh 1vw;min-height:20vh;text-decoration:none;color:var(--text);font-weight:800;text-align:center;font-size:clamp(15px,2.1vh,19px);cursor:pointer;transition:transform .12s,box-shadow .12s;position:relative;}
.subtile .sicon{font-size:clamp(32px,4.6vh,44px);}
.subtile:hover,.subtile:focus-visible{transform:translateY(-6px) scale(1.02);box-shadow:0 14px 28px rgba(0,0,0,.25);outline:3px solid var(--gold);background:linear-gradient(150deg,var(--red),var(--navy));color:#fff;}
.subtile.disabled{opacity:.55;cursor:not-allowed;}
.subtile .go{font-size:12px;opacity:.8;font-weight:600;}
form.absen{display:flex;flex-direction:column;gap:12px;min-width:300px;}
form.absen label{font-size:13px;font-weight:700;color:var(--sub);display:block;margin-bottom:4px;}
form.absen select,form.absen input,form.absen textarea{width:100%;padding:10px;border-radius:10px;border:1px solid #cfd7e6;font-size:14px;background:var(--bg);color:var(--text);}
form.absen textarea{min-height:160px;resize:vertical;}
.submit-btn:disabled{opacity:.7;cursor:not-allowed;}
.spinner{display:inline-block;width:16px;height:16px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;vertical-align:middle;margin-right:8px;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.petugas-meta{font-weight:800;color:var(--red);font-size:13px;margin-bottom:8px;}
.row2{display:flex;gap:12px;}
.row2>div{flex:1;}
.petugas-box{background:var(--bg);padding:14px 16px;border-radius:12px;border:1px solid rgba(0,0,0,.08);}
.petugas-box>label{font-size:13px;font-weight:700;color:var(--sub);display:block;margin-bottom:8px;}
.petugas-row{display:flex;gap:10px;margin-bottom:10px;}
.petugas-row input{flex:1;padding:10px;border-radius:8px;border:1px solid #cfd7e6;font-weight:800;font-size:14px;background:#fff;color:var(--text);}
.ganti-btn{background:var(--gold);border:none;padding:9px 16px;border-radius:8px;font-weight:800;cursor:pointer;color:#4a1e00;}
.ganti-note{font-size:12px;color:var(--red);margin-top:8px;font-weight:700;}
.ganti-note.hidden{display:none;}
.monitor-controls{display:flex;align-items:center;gap:12px;margin-bottom:2vh;flex-wrap:wrap;}
.monitor-controls select{padding:9px 14px;border-radius:8px;border:1px solid #cfd7e6;font-weight:700;font-size:14px;}
.monitor-controls button{background:var(--gold);border:none;padding:9px 16px;border-radius:8px;font-weight:800;cursor:pointer;color:#4a1e00;}
.monitor-table{width:100%;border-collapse:collapse;font-size:clamp(13px,1.6vh,16px);}
.monitor-table th,.monitor-table td{padding:1.3vh 1vw;border-bottom:1px solid rgba(0,0,0,.1);text-align:left;}
.monitor-table th{background:linear-gradient(150deg,var(--red),var(--navy));color:#fff;}
.monitor-table tbody tr:nth-child(even){background:rgba(0,0,0,.03);}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap;}
.badge.ok{background:#16a34a;color:#fff;}
.badge.no{background:#9ca3af;color:#fff;}
.badge.warn{background:var(--red);color:#fff;margin-left:6px;}
.jadwal-wrap{max-height:100%;}
.jadwal-block{margin-bottom:2.6vh;}
.jadwal-table{width:100%;border-collapse:collapse;font-size:clamp(13px,1.6vh,15px);}
.jadwal-table th,.jadwal-table td{border:1px solid #999;padding:8px 12px;text-align:center;}
.jadwal-table thead tr:first-child th{background:#d0d0d0;font-weight:800;font-size:clamp(14px,1.9vh,17px);}
.jadwal-table thead tr:nth-child(2) th{background:#eeeeee;font-weight:700;}
.jadwal-table tbody td:first-child{font-weight:700;background:#fafafa;}
.cal-table{width:100%;border-collapse:collapse;table-layout:fixed;}
.cal-table th{background:linear-gradient(150deg,var(--red),var(--navy));color:#fff;padding:8px 4px;font-size:clamp(12px,1.4vh,14px);text-align:center;}
.cal-table td{border:1px solid #ddd;vertical-align:top;padding:6px;height:12vh;font-size:clamp(10px,1.2vh,12px);}
.cal-empty{background:#f5f5f5;}
.cal-weekend{background:#f0f0f0;}
.cal-day{background:#fffaf2;}
.cal-date{font-weight:800;font-size:clamp(12px,1.5vh,15px);color:#b91c1c;margin-bottom:4px;}
.cal-shift{font-weight:700;color:#7a3b00;margin-bottom:3px;}
.cal-petugas{color:#2b1006;line-height:1.35;font-weight:600;}
.success-view{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4vh;padding:6vh 2vw;text-align:center;}
.success-icon{font-size:clamp(48px,9vh,80px);}
.success-text{font-size:clamp(20px,3vh,30px);font-weight:800;color:var(--red);}
.success-sub{font-size:clamp(13px,1.8vh,17px);color:var(--sub);max-width:520px;}
.submit-btn{background:linear-gradient(150deg,var(--red),var(--navy));color:#fff;border:none;padding:14px;border-radius:10px;font-weight:800;font-size:15px;cursor:pointer;margin-top:4px;}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:linear-gradient(150deg,var(--red),var(--navy));color:#fff;padding:12px 22px;border-radius:999px;font-size:14px;font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.3);z-index:99;transition:opacity .3s;}
#toast.hidden{opacity:0;pointer-events:none;}
</style>
</head>

const PALETTE = ['#e07b00','#e8341f','#ffb300','#c2410c','#d4145a','#f59e0b','#b91c1c','#ea580c','#a8320c'];
function tint(hex){
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},.14)`;
}
function iconForItem(it){
  const u = it.url.toLowerCase();
  if(u.includes('wa.me') || u.includes('wabot')) return '💬';
  if(u.includes('forms.google')) return '📝';
  if(u.includes('drive.google') || u.includes('gdrive')) return '📄';
  if(u.includes('jdih')) return '⚖️';
  if(u.includes('mycloud')) return '📁';
  if(u.includes('cekdptonline')) return '🔎';
  return '🔗';
}

let voiceMode = false;
let isStaff = false;

function speak(text){
  try{
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'id-ID'; u.rate = 0.98;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function normalizeUrl(u){
  if(/xxx/i.test(u)) return null;
  if(!/^https?:\/\//i.test(u)) return 'https://' + u;
  return u;
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>t.classList.add('hidden'), 3200);
}

function renderGrid(){
  const grid = document.getElementById('grid');
  const list = isStaff ? [ABSEN_ITEM, MONITOR_ITEM, JADWAL_ITEM] : SERVICES;
  grid.className = isStaff ? 'staffgrid' : (list.length > 8 ? 'rows5' : '');
  grid.innerHTML = '';
  list.forEach((svc, idx)=>{
    const color = PALETTE[idx % PALETTE.length];
    const btn = document.createElement('button');
    btn.className = 'tile'; btn.setAttribute('role','listitem');
    btn.setAttribute('aria-label', svc.title);
    btn.style.setProperty('--tile-color', color);
    btn.style.setProperty('--tile-tint', tint(color));
    const iconHtml = svc.img ? `<img src="data:image/png;base64,${svc.img}" alt="" class="tile-icon-img">` : `<div class="icon">${svc.icon}</div>`;
    btn.innerHTML = `<button class="speak-btn" aria-label="Dengarkan ${svc.title}" onclick="event.stopPropagation();speak('${svc.title.replace(/'/g,"\\'")}')">🔊</button>
      <div class="icon-wrap">${iconHtml}</div><div class="label">${svc.title}</div>`;
    btn.addEventListener('click', ()=>openModal(svc));
    btn.addEventListener('focus', ()=>{ if(voiceMode) speak(svc.title); });
    btn.addEventListener('mouseenter', ()=>{ if(voiceMode) speak(svc.title); });
    grid.appendChild(btn);
  });
}

function openModal(svc){
  document.getElementById('modalTitle').textContent = svc.title;
  const body = document.getElementById('modalBody');
  if(svc.form){
    body.style.cssText = 'display:block;height:auto;';
    body.innerHTML = absenFormHTML();
    bindAbsenForm();
  } else if(svc.monitor){
    body.style.cssText = 'display:block;height:auto;';
    body.innerHTML = monitorHTML();
    bindMonitor();
  } else if(svc.schedule){
    body.style.cssText = 'display:block;height:auto;';
    body.innerHTML = jadwalHTML();
    bindJadwal();
  } else {
    body.style.cssText = '';
    const cols = Math.min(4, Math.max(2, svc.items.length));
    const tiles = svc.items.map(it=>{
      const url = normalizeUrl(it.url);
      const icon = iconForItem(it);
      if(!url){
        return `<a class="subtile disabled" href="#" onclick="event.preventDefault();toast('Tautan belum tersedia, silakan hubungi admin KPU Pacitan.')">
          <div class="sicon">${icon}</div><div>${it.label}</div><span class="go">Belum tersedia</span></a>`;
      }
      return `<a class="subtile" href="${url}" target="_blank" rel="noopener" onfocus="if(voiceMode) speak('${it.label.replace(/'/g,"\\'")}')" onmouseenter="if(voiceMode) speak('${it.label.replace(/'/g,"\\'")}')">
        <div class="sicon">${icon}</div><div>${it.label}</div><span class="go">Buka ↗</span></a>`;
    }).join('');
    body.innerHTML = `<div class="subgrid" style="grid-template-columns:repeat(${cols},1fr);">${tiles}</div>`;
    if(voiceMode){
      speak(svc.title + '. Pilihan: ' + svc.items.map(i=>i.label).join(', '));
    }
  }
  document.getElementById('overlay').classList.remove('hidden');
  document.getElementById('modalClose').focus();
}
function closeModal(){
  document.getElementById('overlay').classList.add('hidden');
  window.speechSynthesis && window.speechSynthesis.cancel();
}
document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('overlay').addEventListener('click', (e)=>{ if(e.target.id==='overlay') closeModal(); });
document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeModal(); });

document.getElementById('voiceToggle').addEventListener('click', function(){
  voiceMode = !voiceMode;
  this.classList.toggle('active', voiceMode);
  this.setAttribute('aria-pressed', voiceMode);
  if(voiceMode) speak('Mode suara aktif. Arahkan ke menu untuk mendengarkan pilihan.');
});
document.getElementById('staffToggle').addEventListener('click', function(){
  isStaff = !isStaff;
  this.classList.toggle('active', isStaff);
  this.setAttribute('aria-pressed', isStaff);
  this.textContent = isStaff ? '👤 Mode Petugas Aktif' : '👤 Petugas';
  document.querySelector('footer').textContent = isStaff
    ? 'Mode Petugas — isi Absensi Piket sesuai jadwal, atau buka Monitoring Absensi'
    : 'Sentuh salah satu menu untuk melihat layanan · Gunakan tombol 🔊 pada setiap menu untuk mendengarkan pilihan';
  renderGrid();
});

function absenFormHTML(){
  const now = new Date();
  const todayISO = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  return `<form class="absen" id="absenForm">
    <div><label>Tanggal Piket</label><input type="date" id="fTanggal" value="${todayISO}" required></div>
    <div id="petugasBox" class="petugas-box" style="display:none">
      <div class="petugas-meta"><span id="metaShift"></span> &middot; <span id="metaHari"></span></div>
      <label>Petugas Piket Sesuai Jadwal</label>
      <div class="petugas-row"><input type="text" id="fNama1" readonly><input type="text" id="fNama2" readonly></div>
      <button type="button" id="gantiBtn" class="ganti-btn">🔁 Ganti Petugas</button>
      <div id="gantiNote" class="ganti-note hidden">Nama petugas diedit manual — laporan akan ditandai "Ganti Petugas".</div>
    </div>
    <div id="weekendNote" class="ganti-note hidden">Tanggal ini jatuh pada akhir pekan (Sabtu/Minggu) — bukan hari piket.</div>
    <div class="row2">
      <div><label>Waktu Mulai</label><input type="time" id="fMulai" required></div>
      <div><label>Waktu Selesai</label><input type="time" id="fSelesai" required></div>
    </div>
    <div><label>Output / Hasil Piket</label><textarea id="fOutput" required placeholder="Tuliskan ringkasan pekerjaan/hasil piket..."></textarea></div>
    <button type="submit" class="submit-btn" id="submitBtn">Kirim Laporan Absensi</button>
  </form>`;
}
function bindAbsenForm(){
  let ganti = false;
  let currentShift = null, currentHari = null;
  const tglInput=document.getElementById('fTanggal');
  const box=document.getElementById('petugasBox'), n1=document.getElementById('fNama1'), n2=document.getElementById('fNama2');
  const gantiBtn=document.getElementById('gantiBtn'), gantiNote=document.getElementById('gantiNote');
  const weekendNote=document.getElementById('weekendNote');
  const metaShift=document.getElementById('metaShift'), metaHari=document.getElementById('metaHari');
  function updatePetugas(){
    const val = tglInput.value; // yyyy-mm-dd
    if(!val){ box.style.display='none'; weekendNote.classList.add('hidden'); currentShift=null; currentHari=null; return; }
    const [y,m,d] = val.split('-').map(Number);
    const dateObj = new Date(y, m-1, d);
    const dow = dateObj.getDay(); // 0=Minggu..6=Sabtu
    if(dow===0 || dow===6){
      box.style.display='none'; weekendNote.classList.remove('hidden');
      currentShift=null; currentHari=null; return;
    }
    weekendNote.classList.add('hidden');
    currentHari = DAYS[dow-1];
    currentShift = getShiftForDate(dateObj);
    const pair = SCHEDULE[currentShift][currentHari];
    metaShift.textContent = `Shift ${currentShift}`; metaHari.textContent = currentHari;
    n1.value=pair[0]; n2.value=pair[1]; box.style.display='block';
    n1.readOnly=true; n2.readOnly=true; ganti=false; gantiNote.classList.add('hidden');
  }
  tglInput.addEventListener('change', updatePetugas);
  updatePetugas();
  gantiBtn.addEventListener('click', ()=>{
    n1.readOnly=false; n2.readOnly=false; n1.focus();
    ganti=true; gantiNote.classList.remove('hidden');
  });
  document.getElementById('absenForm').addEventListener('submit', async function(e){
    e.preventDefault();
    if(!currentShift || !currentHari){ toast('Pilih tanggal hari kerja (Senin–Jumat) terlebih dahulu.'); return; }
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.dataset.label = submitBtn.textContent;
    submitBtn.innerHTML = '<span class="spinner"></span> Mengirim...';
    const [y,m,d] = tglInput.value.split('-').map(Number);
    const tanggalStr = new Date(y, m-1, d).toLocaleDateString('id-ID');
    const data = {
      shift: currentShift, hari: currentHari,
      tanggal: tanggalStr,
      namaPetugas: `${n1.value}, ${n2.value}`,
      ganti: ganti,
      mulai: document.getElementById('fMulai').value,
      selesai: document.getElementById('fSelesai').value,
      output: document.getElementById('fOutput').value,
    };
    saveLocalLog(data);
    const body = document.getElementById('modalBody');
    let statusMsg;
    if(!CONFIG.SHEET_WEBHOOK_URL){
      statusMsg = 'Tersimpan sementara di perangkat ini (URL spreadsheet belum diatur admin).';
    } else {
      try{
        const res = await fetch(CONFIG.SHEET_WEBHOOK_URL, {method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify(data)});
        statusMsg = res.ok ? 'Laporan berhasil dikirim ke spreadsheet.' : 'Terkirim, namun server membalas status tidak biasa.';
      }catch(err){
        try{
          await fetch(CONFIG.SHEET_WEBHOOK_URL, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'}, body: JSON.stringify(data)});
          statusMsg = 'Terkirim ke server (tanpa konfirmasi), dan tersimpan lokal.';
        }catch(err2){
          statusMsg = 'Gagal mengirim ke server, laporan tersimpan lokal di perangkat ini.';
        }
      }
    }
    body.innerHTML = `<div class="success-view"><div class="success-icon">✅</div><div class="success-text">Absensi Terkirim!</div><div class="success-sub">${statusMsg}</div></div>`;
    toast('Absensi berhasil dikirim. Terima kasih!');
    if(voiceMode) speak('Absensi berhasil dikirim. Terima kasih.');
    setTimeout(closeModal, 2200);
  });
}
function getMonday(d){
  const dt=new Date(d); const day=dt.getDay(); const diff=(day===0?-6:1)-day;
  dt.setDate(dt.getDate()+diff); dt.setHours(0,0,0,0); return dt;
}
const SHIFT_ANCHOR_MONDAY = new Date(2026,9,5); // Senin 5 Oktober 2026 = awal Shift 1
function isTrueFlag(v){
  if(v===true) return true;
  if(typeof v==='string') return v.trim().toLowerCase()==='true';
  return false;
}
function dateKey(val){
  if(val===undefined || val===null || val==='') return null;
  if(typeof val==='string' && val.includes('/')){
    const parts = val.split('/');
    if(parts.length===3){
      const d=parseInt(parts[0],10), m=parseInt(parts[1],10), y=parseInt(parts[2],10);
      if(!isNaN(d)&&!isNaN(m)&&!isNaN(y)) return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    }
  }
  const dt = new Date(val);
  if(isNaN(dt.getTime())) return null;
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
}
function getShiftForDate(date){
  const monday = getMonday(date);
  const diffWeeks = Math.round((monday - SHIFT_ANCHOR_MONDAY) / (7*24*3600*1000));
  const idx = ((diffWeeks % 5) + 5) % 5; // 0..4, aman untuk tanggal sebelum/di luar anchor
  return idx + 1; // 1..5
}
const MONTHS_ID=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
function jadwalHTML(){
  const monthOpts = MONTHS_ID.map((m,i)=>`<option value="${i}" ${i===9?'selected':''}>${m}</option>`).join('');
  const yearOpts = [2026,2027,2028].map(y=>`<option value="${y}" ${y===2026?'selected':''}>${y}</option>`).join('');
  return `<div class="monitor-controls">
    <label>Bulan:</label><select id="jMonth">${monthOpts}</select>
    <label>Tahun:</label><select id="jYear">${yearOpts}</select>
  </div>
  <div id="jCalWrap"></div>`;
}
function bindJadwal(){
  const mSel=document.getElementById('jMonth'), ySel=document.getElementById('jYear');
  const wrap=document.getElementById('jCalWrap');
  function render(){
    const month=parseInt(mSel.value,10), year=parseInt(ySel.value,10);
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const firstDow = (new Date(year,month,1).getDay()+6)%7; // 0=Senin..6=Minggu
    const cells = Array(firstDow).fill(null).concat(Array.from({length:daysInMonth},(_,i)=>i+1));
    while(cells.length % 7 !== 0) cells.push(null);
    const headers = ['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'];
    let html = `<table class="cal-table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>`;
    for(let i=0;i<cells.length;i+=7){
      html += '<tr>';
      for(let j=0;j<7;j++){
        const d = cells[i+j];
        if(d===null){ html += '<td class="cal-empty"></td>'; continue; }
        const dateObj = new Date(year,month,d);
        const dow = dateObj.getDay(); // 0 Minggu .. 6 Sabtu
        if(dow===0 || dow===6){
          html += `<td class="cal-weekend"><div class="cal-date">${d}</div></td>`;
        } else {
          const hari = DAYS[dow-1];
          const shift = getShiftForDate(dateObj);
          const pair = SCHEDULE[shift][hari];
          html += `<td class="cal-day"><div class="cal-date">${d}</div><div class="cal-shift">Shift ${shift}</div><div class="cal-petugas">${pair[0]}<br>${pair[1]}</div></td>`;
        }
      }
      html += '</tr>';
    }
    html += '</tbody></table>';
    wrap.innerHTML = html;
  }
  mSel.addEventListener('change', render);
  ySel.addEventListener('change', render);
  render();
}
function monitorHTML(){
  const now = new Date();
  const monthOpts=MONTHS_ID.map((m,i)=>`<option value="${i}" ${i===now.getMonth()?'selected':''}>${m}</option>`).join('');
  const y=now.getFullYear();
  const yearOpts=[y-1,y,y+1].map(yy=>`<option value="${yy}" ${yy===y?'selected':''}>${yy}</option>`).join('');
  return `<div class="monitor-controls">
    <label>Bulan:</label><select id="mMonth">${monthOpts}</select>
    <label>Tahun:</label><select id="mYear">${yearOpts}</select>
    <button type="button" id="mRefresh">🔄 Refresh Data</button>
  </div>
  <div id="mTableWrap"><p style="text-align:center;padding:4vh 0;">Memuat data...</p></div>`;
}
async function loadAllRecords(){
  if(CONFIG.SHEET_WEBHOOK_URL){
    try{
      const sep = CONFIG.SHEET_WEBHOOK_URL.includes('?') ? '&' : '?';
      const res = await fetch(CONFIG.SHEET_WEBHOOK_URL + sep + 'action=list');
      const remote = await res.json();
      return remote; // spreadsheet jadi sumber kebenaran — baris yang dihapus di sana ikut hilang di sini
    }catch(e){ /* server tidak terjangkau, lanjut pakai cadangan lokal di bawah */ }
  }
  let local=[];
  try{ local = JSON.parse(localStorage.getItem('kpu_absensi_log')||'[]'); }catch(e){}
  return local;
}
function bindMonitor(){
  const monthSel=document.getElementById('mMonth');
  const yearSel=document.getElementById('mYear');
  const wrap=document.getElementById('mTableWrap');
  async function render(){
    wrap.innerHTML = '<p style="text-align:center;padding:4vh 0;">Memuat data...</p>';
    const month = parseInt(monthSel.value,10);
    const year = parseInt(yearSel.value,10);
    const all = await loadAllRecords();
    const daysInMonth = new Date(year, month+1, 0).getDate();
    let rows = '';
    for(let d=1; d<=daysInMonth; d++){
      const target = new Date(year, month, d);
      const dow = target.getDay(); // 0=Minggu ... 6=Sabtu
      if(dow<1 || dow>5) continue; // hanya hari kerja Senin-Jumat
      const hari = DAYS[dow-1];
      const shift = getShiftForDate(target);
      const dateStr = target.toLocaleDateString('id-ID');
      const match = all.filter(r=> dateKey(r.tanggal)===dateKey(dateStr)).pop();
      const defaultNames = (SCHEDULE[shift] && SCHEDULE[shift][hari]) ? SCHEDULE[shift][hari].join(', ') : '-';
      const namaTampil = (match && match.namaPetugas) ? match.namaPetugas : defaultNames;
      const status = match ? `<span class="badge ok">Sudah Absen</span>` : `<span class="badge no">Belum Absen</span>`;
      const gantiBadge = isTrueFlag(match && match.ganti) ? `<span class="badge warn">Ganti Petugas</span>` : '';
      rows += `<tr><td>Shift ${shift}</td><td>${hari}<br><small>${dateStr}</small></td><td>${namaTampil}</td><td>${match?match.mulai:'-'}</td><td>${match?match.selesai:'-'}</td><td>${status}${gantiBadge}</td></tr>`;
    }
    if(!rows) rows = '<tr><td colspan="6" style="text-align:center;">Tidak ada hari kerja pada bulan ini.</td></tr>';
    wrap.innerHTML = `<table class="monitor-table"><thead><tr><th>Shift</th><th>Hari / Tanggal</th><th>Nama Petugas</th><th>Mulai</th><th>Selesai</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table>`;
  }
  monthSel.addEventListener('change', render);
  yearSel.addEventListener('change', render);
  document.getElementById('mRefresh').addEventListener('click', render);
  render();
}
function saveLocalLog(data){
  try{
    const key='kpu_absensi_log';
    const arr = JSON.parse(localStorage.getItem(key) || '[]');
    arr.push(data);
    localStorage.setItem(key, JSON.stringify(arr));
  }catch(e){}
}

renderGrid();
</script>
