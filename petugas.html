<style>
/* ===== gaya bersama, disalin otomatis dari Index.html ===== */
:root{
  --navy:#5a0f1f; --red:#9b1c31; --gold:#e2b44f; --gold-dark:#a8730a; --bg:#ffffff; --card:#ffffff; --text:#2d0a12; --sub:#6b4650; --radius:20px;
}
.spinner.dark{border-color:rgba(122,20,40,.25);border-top-color:var(--red);margin-right:0;}
.jd-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px;}
.jd-nav{display:flex;align-items:center;gap:8px;}
.jd-btn{width:40px;height:40px;border-radius:50%;border:2px solid var(--gold);background:#fff;color:var(--red);font-size:24px;font-weight:800;line-height:1;cursor:pointer;}
.jd-btn:hover{background:var(--gold);}
.jd-title{min-width:190px;text-align:center;font-size:clamp(20px,2.8vh,26px);font-weight:900;color:var(--red);}
.jd-today-btn{background:var(--gold);border:none;border-radius:999px;padding:9px 16px;font-weight:800;color:#3b0a14;cursor:pointer;margin-left:6px;}
.jd-find{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--sub);font-size:14px;}
.jd-find select{padding:9px 12px;border-radius:10px;border:1px solid #e0c4ca;font-size:14px;font-weight:600;max-width:280px;}
.jd-hero{display:flex;align-items:center;gap:20px;flex-wrap:wrap;background:linear-gradient(150deg,var(--red),var(--navy));color:#fff;border-radius:16px;padding:14px 20px;margin-bottom:14px;border-bottom:4px solid var(--gold);}
.jd-hero.off{background:#f6e6e9;color:var(--text);}
.jd-hero-l{display:flex;flex-direction:column;}
.jd-hero-l span{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#f6d995;}
.jd-hero.off .jd-hero-l span{color:var(--sub);}
.jd-hero-l b{font-size:clamp(17px,2.3vh,21px);}
.jd-hero-l em{font-style:normal;font-weight:800;color:#f6d995;font-size:14px;}
.jd-hero-names{display:flex;gap:12px;flex-wrap:wrap;margin-left:auto;}
.jd-person{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.14);border:1.5px solid rgba(240,201,135,.6);border-radius:999px;padding:6px 16px 6px 6px;font-size:clamp(16px,2.2vh,20px);font-weight:800;}
.jd-person i{font-style:normal;width:36px;height:36px;border-radius:50%;background:#f0c987;color:#3b0a14;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;}
.jd-grid{display:grid;grid-template-columns:132px repeat(5,minmax(0,1fr));gap:6px;}
.jd-h{text-align:center;font-weight:800;color:#fff;background:linear-gradient(150deg,var(--red),var(--navy));border-radius:10px;padding:8px 4px;font-size:clamp(14px,1.8vh,16px);}
.jd-h:first-child{background:none;}
.jd-week{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:4px;padding:8px 10px;background:#fbf3f5;border-radius:12px;border-left:5px solid var(--gold);}
.jd-shift{font-weight:900;color:var(--red);font-size:clamp(16px,2.1vh,19px);}
.jd-range{font-size:12.5px;font-weight:700;color:var(--sub);}
.jd-day{background:#fff;border:1.5px solid #eadde0;border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:5px;min-height:96px;}
.jd-day.out{opacity:.38;}
.jd-day.past{background:#fcfafa;}
.jd-day.past .jd-name{opacity:.75;}
.jd-day.today{border:3px solid var(--gold);box-shadow:0 6px 16px rgba(226,180,79,.35);background:#fffaf0;}
.jd-day.hit{background:#fff4dc;border-color:var(--gold);}
.jd-day.dim{opacity:.35;}
.jd-date{font-size:clamp(20px,2.8vh,26px);font-weight:900;color:var(--red);line-height:1;display:flex;align-items:center;gap:8px;}
.jd-date span{font-size:11px;font-weight:800;background:var(--gold);color:#3b0a14;border-radius:999px;padding:3px 8px;}
.jd-name{display:flex;align-items:center;gap:7px;font-size:clamp(14px,1.85vh,16.5px);font-weight:700;color:var(--text);line-height:1.2;}
.jd-name i{font-style:normal;flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:#f6e6e9;color:#7a1428;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;}
.jd-name.me{color:var(--red);font-weight:900;}
.jd-name.me i{background:var(--red);color:#fff;}
.jd-note{margin-top:10px;font-size:13px;font-weight:600;color:var(--sub);}
@media (max-width:760px){.jd-grid{grid-template-columns:1fr}.jd-h{display:none}.jd-day.out{display:none}}
.badge-online{display:inline-block;margin-left:6px;background:#e6f0fd;color:#1d4ed8;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:800;vertical-align:middle;}
.hadir-note{font-size:13px;color:var(--sub);font-weight:600;}
.lp-btns{white-space:nowrap;}
.mini-btn{background:#fff;border:1.5px solid var(--red);color:#7a1428;padding:5px 10px;border-radius:8px;font-weight:800;font-size:12px;cursor:pointer;margin:2px;}
.mini-btn:hover{background:var(--gold);}
form.absen{display:flex;flex-direction:column;gap:12px;min-width:300px;}
form.absen input,form.absen select,form.absen textarea{font-family:inherit;}
.date-row{display:flex;gap:10px;align-items:stretch;}
.date-row input{flex:1;}
.date-btn{background:var(--gold);border:none;border-radius:10px;padding:0 20px;font-weight:800;font-size:14px;color:#3b0a14;cursor:pointer;white-space:nowrap;}
input[type=date]::-webkit-calendar-picker-indicator,input[type=time]::-webkit-calendar-picker-indicator{opacity:1;cursor:pointer;}
form.absen label{font-size:13px;font-weight:700;color:var(--sub);display:block;margin-bottom:4px;}
form.absen select,form.absen input,form.absen textarea{width:100%;padding:10px;border-radius:10px;border:1px solid #e0c4ca;font-size:14px;background:var(--bg);color:var(--text);}
form.absen textarea{min-height:160px;resize:vertical;}
.submit-btn:disabled{opacity:.7;cursor:not-allowed;}
.spinner{display:inline-block;width:16px;height:16px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;vertical-align:middle;margin-right:8px;animation:spin .7s linear infinite;}
.petugas-meta{font-weight:800;color:var(--red);font-size:13px;margin-bottom:8px;}
.row2{display:flex;gap:12px;}
.row2>div{flex:1;}
.petugas-box{background:var(--bg);padding:14px 16px;border-radius:12px;border:1px solid rgba(0,0,0,.08);}
.petugas-box>label{font-size:13px;font-weight:700;color:var(--sub);display:block;margin-bottom:8px;}
.petugas-row{display:flex;gap:10px;margin-bottom:10px;}
.petugas-row input{flex:1;padding:10px;border-radius:8px;border:1px solid #e0c4ca;font-weight:800;font-size:14px;background:#fff;color:var(--text);}
.ganti-btn{background:var(--gold);border:none;padding:9px 16px;border-radius:8px;font-weight:800;cursor:pointer;color:#3b0a14;}
.ganti-note{font-size:12px;color:var(--red);margin-top:8px;font-weight:700;}
.ganti-note.hidden{display:none;}
.monitor-controls{display:flex;align-items:center;gap:12px;margin-bottom:2vh;flex-wrap:wrap;}
.monitor-controls select{padding:9px 14px;border-radius:8px;border:1px solid #e0c4ca;font-weight:700;font-size:14px;}
.monitor-controls button{background:var(--gold);border:none;padding:9px 16px;border-radius:8px;font-weight:800;cursor:pointer;color:#3b0a14;}
.monitor-table{width:100%;border-collapse:collapse;font-size:clamp(13px,1.6vh,16px);}
.monitor-table th,.monitor-table td{padding:1.3vh 1vw;border-bottom:1px solid rgba(0,0,0,.1);text-align:left;}
.monitor-table th{background:linear-gradient(150deg,var(--red),var(--navy));color:#fff;}
.monitor-table tbody tr:nth-child(even){background:rgba(0,0,0,.03);}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap;}
.badge.ok{background:#16a34a;color:#fff;}
.badge.no{background:#9ca3af;color:#fff;}
.badge.warn{background:var(--red);color:#fff;margin-left:6px;}
.success-view{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4vh;padding:6vh 2vw;text-align:center;}
.success-icon{font-size:clamp(48px,9vh,80px);}
.success-text{font-size:clamp(20px,3vh,30px);font-weight:800;color:var(--red);}
.success-sub{font-size:clamp(13px,1.8vh,17px);color:var(--sub);max-width:520px;}
.submit-btn{background:linear-gradient(150deg,var(--red),var(--navy));color:#fff;border:none;padding:14px;border-radius:10px;font-weight:800;font-size:15px;cursor:pointer;margin-top:4px;}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:linear-gradient(150deg,var(--red),var(--navy));color:#fff;padding:12px 22px;border-radius:999px;font-size:14px;font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.3);z-index:99;transition:opacity .3s;}
#toast.hidden{opacity:0;pointer-events:none;}
@media print{
  html,body{height:auto !important;overflow:visible !important;background:#fff !important;}
  body > *:not(#printArea):not(#printReport){display:none !important;}
  #printReport{display:block !important;}
  #printArea{display:block !important;}
  #printArea img{display:block;page-break-after:always;break-after:page;object-fit:contain;}
  #printArea img:last-child{page-break-after:auto;break-after:auto;}
}

/* =====================================================================
   TAMPILAN HALAMAN PETUGAS (web & mobile) — menimpa gaya bersama di atas
   ===================================================================== */
:root{
  --maroon:#7a1428; --maroon-2:#5a0f1f; --maroon-3:#3a0712; --red:#9b1c31; --gold:#e2b44f; --gold-2:#f3c87a;
  --ink:#24121a; --text:#24121a; --sub:#6e5960; --line:#efe3e6; --soft:#faf5f6; --page:#f5eff1; --card:#ffffff;
  --ok:#16a34a; --ok-bg:#e8f7ee; --no:#94a3b8; --no-bg:#f1f3f6; --warn:#c2410c; --warn-bg:#fff1e6;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  --sh-1:0 1px 2px rgba(58,7,18,.05),0 4px 14px rgba(58,7,18,.06);
  --sh-2:0 10px 30px rgba(58,7,18,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;min-height:100%;font-family:'Plus Jakarta Sans','Segoe UI',Roboto,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
html{background:var(--page);}
body{background:transparent !important;position:relative;}
body{padding-bottom:env(safe-area-inset-bottom,0px);}
button,input,select,textarea{font-family:inherit;}
.hidden{display:none !important;}

/* ---------- latar & header ---------- */
.bg{position:absolute;inset:0 0 auto 0;height:250px;z-index:-1;border-radius:0 0 36px 36px;background:
  radial-gradient(800px 260px at 85% -40px,rgba(243,200,122,.35),transparent 60%),
  radial-gradient(600px 300px at 0% 0%,rgba(155,28,49,.9),transparent 70%),
  linear-gradient(135deg,#8f1c31 0%,#5a0f1f 55%,#3a0712 100%);}
.bg::after{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.12) 1px,transparent 1px);background-size:18px 18px;mask-image:linear-gradient(#000,transparent 85%);-webkit-mask-image:linear-gradient(#000,transparent 85%);}
header.top{max-width:1180px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) 24px 0;display:flex;align-items:center;gap:14px;color:#fff;}
header.top .logo{width:46px;height:46px;object-fit:contain;flex:none;background:#fff;border-radius:50%;padding:3px;box-shadow:0 4px 14px rgba(0,0,0,.25);}
.brand b{display:block;font-size:18px;font-weight:800;letter-spacing:-.01em;line-height:1.2;}
.brand span{display:block;font-size:12.5px;color:var(--gold-2);font-weight:600;}
.clock{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;}
.clock b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1;}
.clock span{display:block;font-size:12px;color:#f3d9de;font-weight:600;margin-top:2px;}
.pill{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-style:normal;font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;white-space:nowrap;}
.pill::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor;}
.pill.ok{background:#e8f7ee;color:#15803d;} .pill.no{background:#fff1e6;color:#c2410c;} .pill.off,.pill.wait{color:#f3d9de;}
/* halaman petugas: tanpa kartu "petugas piket hari ini" & tanpa tombol Pilih Tanggal */
.jd-hero,.date-btn{display:none !important;}
.jd-tile{display:none;}
form.absen input[type=date],form.absen input[type=time]{-webkit-appearance:none;appearance:none;display:block;width:100%;max-width:100%;min-width:0;min-height:48px;text-align:left;cursor:pointer;}
form.absen input::-webkit-date-and-time-value{text-align:left;}
.date-row,.row2>div{min-width:0;}

/* ---------- kartu sapaan / hari ini ---------- */
.hero{max-width:1180px;margin:18px auto 0;padding:0 24px;}
.hero-in{display:grid;grid-template-columns:1.2fr 1fr auto;gap:18px;align-items:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:var(--r-lg);padding:18px 22px;color:#fff;}
.hello small{display:block;color:var(--gold-2);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;}
.hello b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:2px;}
.hello span{display:block;font-size:13.5px;color:#f3d9de;margin-top:2px;}
.duty{display:flex;flex-direction:column;gap:8px;}
.duty small{color:#f3d9de;font-weight:700;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;}
.duty .people{display:flex;flex-wrap:wrap;gap:8px;}
.chip-p{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:4px 12px 4px 4px;font-weight:700;font-size:13.5px;}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:800;color:var(--maroon-3);background:linear-gradient(135deg,#fde7b4,var(--gold));flex:none;}
.state{justify-self:end;display:flex;align-items:center;gap:10px;background:#fff;color:var(--ink);border-radius:var(--r-md);padding:10px 14px;min-width:190px;box-shadow:var(--sh-2);}
.state i{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;}
.state i svg{width:20px;height:20px;}
.state b{display:block;font-size:14px;}
.state span{display:block;font-size:12px;color:var(--sub);font-weight:600;}
.state.ok i{background:var(--ok-bg);color:var(--ok);}
.state.no i{background:var(--warn-bg);color:var(--warn);}
.state.off i,.state.wait i{background:var(--no-bg);color:#64748b;}

/* ---------- navigasi ---------- */
nav.tabs{max-width:1180px;margin:18px auto 0;padding:0 24px;display:flex;}
.seg{display:inline-flex;gap:4px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:5px;}
nav.tabs a{display:flex;align-items:center;gap:9px;padding:10px 18px;border-radius:12px;color:#fbe8ec;text-decoration:none;font-weight:700;font-size:14.5px;transition:background .2s,color .2s;}
nav.tabs a svg{width:19px;height:19px;flex:none;}
nav.tabs a:hover{background:rgba(255,255,255,.1);color:#fff;}
nav.tabs a.on{background:#fff;color:var(--maroon);box-shadow:0 4px 14px rgba(0,0,0,.18);}

/* ---------- isi ---------- */
main.wrap{max-width:1180px;margin:0 auto;padding:18px 24px 48px;}
.card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--sh-2);padding:26px 28px;border:1px solid rgba(255,255,255,.6);animation:rise .35s ease;}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card-h{display:flex;align-items:flex-start;gap:14px;margin-bottom:20px;}
.card-h .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;background:linear-gradient(135deg,#fbe4e8,#f6d2d9);color:var(--red);}
.card-h .ic svg{width:24px;height:24px;}
.card-h h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em;color:var(--ink);}
.card-h p{margin:3px 0 0;color:var(--sub);font-size:13.5px;font-weight:500;line-height:1.5;}
.foot-note{text-align:center;color:var(--sub);font-size:12.5px;margin-top:18px;}

/* ---------- form absensi ---------- */
form.absen{max-width:820px;gap:16px;min-width:0;}
form.absen label,.petugas-box>label{font-size:12.5px;font-weight:700;color:var(--sub);letter-spacing:.01em;margin-bottom:6px;}
form.absen select,form.absen input,form.absen textarea,.petugas-row input{border:1.5px solid var(--line);background:var(--soft);border-radius:12px;padding:12px 14px;font-size:15px;color:var(--ink);transition:border-color .15s,box-shadow .15s,background .15s;}
form.absen input:focus,form.absen textarea:focus,.petugas-row input:focus{outline:none;border-color:var(--gold);background:#fff;box-shadow:0 0 0 4px rgba(226,180,79,.22);}
form.absen textarea{min-height:150px;line-height:1.55;}
.date-btn,.ganti-btn,.monitor-controls button,.jd-today-btn{background:#fff6e2;color:#7a4e00;border:1.5px solid #f2d79a;border-radius:12px;font-weight:700;transition:background .15s,transform .1s;}
.date-btn:hover,.ganti-btn:hover,.monitor-controls button:hover,.jd-today-btn:hover{background:#ffeec6;}
.date-btn:active,.ganti-btn:active,.submit-btn:active{transform:scale(.98);}
.petugas-box{background:linear-gradient(180deg,#fff,#fbf6f7);border:1.5px solid var(--line);border-radius:16px;padding:16px 18px;}
.petugas-meta{display:inline-flex;align-items:center;gap:6px;background:#fbe4e8;color:var(--maroon);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:800;margin-bottom:12px;}
.petugas-row input{background:#fff;font-weight:700;}
.ganti-note{color:var(--warn);}
.hadir-note{color:var(--sub);font-weight:500;font-size:12.5px;}
.submit-btn{border-radius:14px;padding:15px;font-size:16px;font-weight:800;letter-spacing:.01em;background:linear-gradient(135deg,#a31f36,#6a1225);box-shadow:0 8px 20px rgba(122,20,40,.28);transition:transform .1s,box-shadow .2s;}
.submit-btn:hover{box-shadow:0 10px 26px rgba(122,20,40,.36);}
.success-view{padding:48px 16px;}
.success-icon{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:var(--ok-bg);font-size:44px;animation:pop .45s cubic-bezier(.2,1.4,.4,1);}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.success-text{color:var(--ink);font-weight:800;letter-spacing:-.02em;}

/* ---------- monitoring ---------- */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px;}
.stat{background:var(--soft);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;}
.stat small{display:block;font-size:11.5px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.06em;}
.stat b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:4px;}
.stat .bar{height:6px;border-radius:99px;background:#eadde0;margin-top:8px;overflow:hidden;}
.stat .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),#d18f1a);}
.stat.ok b{color:var(--ok);} .stat.no b{color:var(--warn);}
.monitor-controls{gap:10px;margin-bottom:16px;}
.monitor-controls label{font-size:13px;font-weight:700;color:var(--sub);}
.monitor-controls select{border:1.5px solid var(--line);background:var(--soft);border-radius:12px;padding:10px 14px;font-weight:700;color:var(--ink);}
.monitor-controls button{padding:10px 16px;}
#mTableWrap{border:1.5px solid var(--line);border-radius:16px;overflow:hidden;}
.monitor-table{font-size:14px;}
.monitor-table th{background:var(--soft);color:var(--sub);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:12px 14px;border-bottom:1.5px solid var(--line);}
.monitor-table td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle;}
.monitor-table tbody tr:nth-child(even){background:transparent;}
.monitor-table tbody tr:hover{background:#fdf8f9;}
.monitor-table tbody tr:last-child td{border-bottom:none;}
.monitor-table td small{color:var(--sub);font-weight:600;}
.monitor-table td:first-child{white-space:nowrap;font-weight:700;}
.monitor-table tr.is-today{background:#fffaf0 !important;box-shadow:inset 4px 0 0 var(--gold);}
.badge{padding:5px 11px;font-size:11.5px;font-weight:800;letter-spacing:.01em;}
.badge.ok{background:var(--ok-bg);color:var(--ok);}
.badge.no{background:var(--no-bg);color:#64748b;}
.badge.warn{background:var(--warn-bg);color:var(--warn);}
.mini-btn{border:1.5px solid var(--line);background:#fff;color:var(--maroon);border-radius:10px;padding:7px 12px;font-weight:700;font-size:12.5px;transition:background .15s,border-color .15s;}
.mini-btn:hover{background:#fff6e2;border-color:#f2d79a;}

/* ---------- jadwal ---------- */
.jd-btn{border:1.5px solid var(--line);background:#fff;color:var(--maroon);width:42px;height:42px;font-size:22px;}
.jd-btn:hover{background:#fff6e2;border-color:#f2d79a;}
.jd-title{font-weight:800;letter-spacing:-.02em;color:var(--ink);font-size:22px;}
.jd-today-btn{padding:9px 16px;}
.jd-find{color:var(--sub);font-weight:700;}
.jd-find select{border:1.5px solid var(--line);background:var(--soft);border-radius:12px;padding:10px 14px;color:var(--ink);}
.jd-hero{border-radius:18px;background:linear-gradient(135deg,#8f1c31,#5a0f1f);box-shadow:0 10px 26px rgba(90,15,31,.25);border:none;}
.jd-h{background:var(--soft);color:var(--sub);font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;border-radius:12px;}
.jd-h:first-child{background:none;}
.jd-week{background:linear-gradient(180deg,#fff8ea,#fff3dc);border-left:none;border:1.5px solid #f2d79a;border-radius:14px;}
.jd-shift{color:#7a4e00;}
.jd-day{border:1.5px solid var(--line);border-radius:14px;transition:transform .15s,box-shadow .15s;}
.jd-day:hover{transform:translateY(-2px);box-shadow:var(--sh-1);}
.jd-day.today{border:2px solid var(--gold);background:#fffaf0;}
.jd-date{color:var(--ink);font-weight:800;}
.jd-name i{background:#fbe4e8;color:var(--maroon);}

/* ---------- toast ---------- */
#toast{z-index:100;border-radius:14px;font-weight:700;box-shadow:var(--sh-2);background:#24121a;}

/* ---------- tablet ---------- */
@media (max-width:1000px){
  .hero-in{grid-template-columns:1fr 1fr;}
  .state{grid-column:1/-1;justify-self:stretch;}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));}
}
/* ---------- ponsel ---------- */
@media (max-width:760px){
  .bg{height:190px;border-radius:0 0 28px 28px;}
  header.top{padding:calc(12px + env(safe-area-inset-top,0px)) 16px 0;}
  header.top .logo{width:40px;height:40px;}
  .brand b{font-size:16px;}
  .brand span{font-size:11.5px;}
  .brand .long{display:none;}
  .clock b{font-size:19px;}
  .hero{padding:0 12px;margin-top:14px;}
  .hero-in{grid-template-columns:1fr;gap:12px;padding:16px;}
  .hello b{font-size:19px;}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;margin:0;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(58,7,18,.08);}
  .seg{display:flex;width:100%;background:none;border:none;padding:0;gap:6px;}
  nav.tabs a{flex:1;flex-direction:column;gap:3px;padding:8px 4px;color:var(--sub);font-size:11.5px;text-align:center;border-radius:14px;}
  nav.tabs a svg{width:22px;height:22px;}
  nav.tabs a.on{background:#fbe4e8;color:var(--maroon);box-shadow:none;}
  main.wrap{padding:14px 12px calc(100px + env(safe-area-inset-bottom,0px));}
  .card{padding:18px 16px;border-radius:20px;}
  .card-h{gap:12px;margin-bottom:16px;}
  .card-h .ic{width:40px;height:40px;border-radius:12px;}
  .card-h h2{font-size:19px;}
  .row2,.petugas-row,.date-row{flex-direction:column;}
  .date-btn{padding:12px 16px;}
  form.absen select,form.absen input,form.absen textarea,.petugas-row input{font-size:16px;}
  .stats{gap:10px;}
  .stat{padding:12px 14px;}
  .stat b{font-size:22px;}
  .monitor-controls label{display:none;}
  .monitor-controls select,.monitor-controls button{flex:1;font-size:15px;}
  #mTableWrap{border:none;border-radius:0;overflow:visible;}
  .monitor-table thead{display:none;}
  .monitor-table,.monitor-table tbody,.monitor-table tr,.monitor-table td{display:block;width:100%;}
  .monitor-table tr{background:#fff !important;border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;}
  .monitor-table tr.is-today{border-color:var(--gold);box-shadow:0 6px 18px rgba(226,180,79,.3);}
  .monitor-table td{border:none;padding:5px 0;display:flex;gap:10px;align-items:flex-start;text-align:left !important;}
  .monitor-table td::before{content:attr(data-label);flex:0 0 92px;font-size:11px;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;padding-top:3px;}
  .monitor-table td:first-child{font-weight:800;color:var(--maroon);}
  .monitor-table td.lp-btns{white-space:normal;flex-wrap:wrap;padding-top:8px;}
  .monitor-table td.lp-btns .mini-btn{padding:9px 14px;font-size:13px;}
  .jd-bar{flex-direction:column;align-items:stretch;}
  .jd-nav{justify-content:space-between;}
  .jd-title{min-width:0;flex:1;font-size:19px;}
  .jd-find{flex-wrap:wrap;}
  .jd-find select{max-width:none;flex:1;font-size:15px;}
  .jd-hero{padding:14px;gap:10px;}
  .jd-hero-names{margin-left:0;}
  .jd-person{font-size:14.5px;}
  .jd-week{margin-top:10px;}
  .jd-day{min-height:0;display:grid;grid-template-columns:58px 1fr;grid-auto-rows:auto;column-gap:14px;row-gap:6px;align-items:center;padding:10px 12px;}
  .jd-tile{display:flex;grid-row:1 / span 3;flex-direction:column;align-items:center;justify-content:center;align-self:stretch;background:#fbe4e8;color:var(--maroon);border-radius:12px;padding:6px 0;line-height:1.1;}
  .jd-tile b{font-size:22px;font-weight:800;}
  .jd-tile small{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;}
  .jd-day.today .jd-tile{background:var(--gold);color:#3b0a14;}
  .jd-day .jd-date{display:none;}

  .jd-day:hover{transform:none;box-shadow:none;}
  #toast{bottom:calc(92px + env(safe-area-inset-bottom,0px));width:max-content;max-width:calc(100vw - 24px);text-align:center;}
}
@media print{ .bg, header.top, nav.tabs, main.wrap, #toast{display:none !important;} }
@media (prefers-reduced-motion:reduce){ *{animation:none !important;transition:none !important;} }
</style>

<body>

function bindAbsenForm(){
  let ganti = false;
  let currentShift = null, currentHari = null;
  const tglInput=document.getElementById('fTanggal');
  const box=document.getElementById('petugasBox'), n1=document.getElementById('fNama1'), n2=document.getElementById('fNama2');
  const gantiBtn=document.getElementById('gantiBtn'), gantiNote=document.getElementById('gantiNote');
  const weekendNote=document.getElementById('weekendNote');
  const metaShift=document.getElementById('metaShift'), metaHari=document.getElementById('metaHari');
  function updatePetugas(){
    const val = tglInput.value; // yyyy-mm-dd
    if(!val){ box.style.display='none'; weekendNote.classList.add('hidden'); currentShift=null; currentHari=null; return; }
    const [y,m,d] = val.split('-').map(Number);
    const dateObj = new Date(y, m-1, d);
    const dow = dateObj.getDay(); // 0=Minggu..6=Sabtu
    if(dow===0 || dow===6){
      box.style.display='none'; weekendNote.classList.remove('hidden');
      currentShift=null; currentHari=null; return;
    }
    weekendNote.classList.add('hidden');
    currentHari = DAYS[dow-1];
    currentShift = getShiftForDate(dateObj);
    const pair = SCHEDULE[currentShift][currentHari];
    metaShift.textContent = `Shift ${currentShift}`; metaHari.textContent = currentHari;
    n1.value=pair[0]; n2.value=pair[1]; box.style.display='block';
    n1.readOnly=true; n2.readOnly=true; ganti=false; gantiNote.classList.add('hidden');
  }
  tglInput.addEventListener('change', updatePetugas);
  const outEl = document.getElementById('fOutput');
  outEl.dataset.auto = '1';
  outEl.addEventListener('input', ()=>{ outEl.dataset.auto = '0'; });
  async function fillOutput(){
    const iso = tglInput.value; if(!iso) return;
    const rows = (await loadHadir()).filter(r=>r.tanggal===iso).sort((a,b)=>urutNo(a)-urutNo(b));
    if(outEl.dataset.auto !== '1' || tglInput.value !== iso) return;
    outEl.value = outputPiketText(rows);
  }
  tglInput.addEventListener('change', fillOutput);
  fillOutput();
  document.getElementById('datePickBtn').addEventListener('click', ()=>{
    try{ tglInput.showPicker(); }catch(e){ tglInput.focus(); try{ tglInput.click(); }catch(_){} }
  });
  updatePetugas();
  gantiBtn.addEventListener('click', ()=>{
    n1.readOnly=false; n2.readOnly=false; n1.focus();
    ganti=true; gantiNote.classList.remove('hidden');
  });
  document.getElementById('absenForm').addEventListener('submit', async function(e){
    e.preventDefault();
    if(!currentShift || !currentHari){ toast('Pilih tanggal hari kerja (Senin–Jumat) terlebih dahulu.'); return; }
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.dataset.label = submitBtn.textContent;
    submitBtn.innerHTML = '<span class="spinner"></span> Mengirim...';
    const [y,m,d] = tglInput.value.split('-').map(Number);
    const tanggalStr = new Date(y, m-1, d).toLocaleDateString('id-ID');
    const data = {
      shift: currentShift, hari: currentHari,
      tanggal: tanggalStr,
      namaPetugas: `${n1.value}, ${n2.value}`,
      ganti: ganti,
      mulai: document.getElementById('fMulai').value,
      selesai: document.getElementById('fSelesai').value,
      output: document.getElementById('fOutput').value,
    };
    saveLocalLog(data);
    try{ localStorage.setItem('kpu_absen_done_'+tglInput.value, '1'); }catch(e){}
    hideAbsenAlert();
    const body = document.getElementById('modalBody');
    let statusMsg;
    if(!CONFIG.SHEET_WEBHOOK_URL){
      statusMsg = 'Tersimpan sementara di perangkat ini (URL spreadsheet belum diatur admin).';
    } else {
      try{
        const res = await fetch(CONFIG.SHEET_WEBHOOK_URL, {method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify(data)});
        statusMsg = res.ok ? 'Laporan berhasil dikirim ke spreadsheet.' : 'Terkirim, namun server membalas status tidak biasa.';
      }catch(err){
        try{
          await fetch(CONFIG.SHEET_WEBHOOK_URL, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'}, body: JSON.stringify(data)});
          statusMsg = 'Terkirim ke server (tanpa konfirmasi), dan tersimpan lokal.';
        }catch(err2){
          statusMsg = 'Gagal mengirim ke server, laporan tersimpan lokal di perangkat ini.';
        }
      }
    }
    body.innerHTML = `<div class="success-view"><div class="success-icon">✅</div><div class="success-text">Absensi Terkirim!</div><div class="success-sub">${statusMsg}</div></div>`;
    toast('Absensi berhasil dikirim. Terima kasih!');
    if(voiceMode) speak('Absensi berhasil dikirim. Terima kasih.');
    setTimeout(closeModal, 2200);
  });
}
function getMonday(d){
  const dt=new Date(d); const day=dt.getDay(); const diff=(day===0?-6:1)-day;
  dt.setDate(dt.getDate()+diff); dt.setHours(0,0,0,0); return dt;
}
const SHIFT_ANCHOR_MONDAY = new Date(2026,9,5); // Senin 5 Oktober 2026 = awal Shift 1
function isTrueFlag(v){
  if(v===true) return true;
  if(typeof v==='string') return v.trim().toLowerCase()==='true';
  return false;
}
function dateKey(val){
  if(val===undefined || val===null || val==='') return null;
  if(typeof val==='string' && val.includes('/')){
    const parts = val.split('/');
    if(parts.length===3){
      const d=parseInt(parts[0],10), m=parseInt(parts[1],10), y=parseInt(parts[2],10);
      if(!isNaN(d)&&!isNaN(m)&&!isNaN(y)) return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    }
  }
  const dt = new Date(val);
  if(isNaN(dt.getTime())) return null;
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
}
function getShiftForDate(date){
  const monday = getMonday(date);
  const diffWeeks = Math.round((monday - SHIFT_ANCHOR_MONDAY) / (7*24*3600*1000));
  const idx = ((diffWeeks % 5) + 5) % 5; // 0..4, aman untuk tanggal sebelum/di luar anchor
  return idx + 1; // 1..5
}
const MONTHS_ID=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

function bindJadwal(){
  let cur = new Date(); cur = new Date(cur.getFullYear(), cur.getMonth(), 1);
  const wrap=document.getElementById('jCalWrap'), hero=document.getElementById('jHero'), find=document.getElementById('jFind');
  const inisial = n => n.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
  const tglPendek = d => `${d.getDate()} ${MONTHS_ID[d.getMonth()].slice(0,3)}`;
  function render(){
    const year=cur.getFullYear(), month=cur.getMonth(), todayISO=isoDate(new Date()), sorot=find.value;
    document.getElementById('jTitle').textContent = `${MONTHS_ID[month]} ${year}`;
    // kartu "hari ini"
    const t=new Date(), dow=t.getDay();
    if(dow>=1 && dow<=5){
      const sh=getShiftForDate(t), pair=SCHEDULE[sh][DAYS[dow-1]];
      hero.innerHTML = `<div class="jd-hero"><div class="jd-hero-l"><span>Petugas piket hari ini</span><b>${HARI_ID[dow]}, ${t.getDate()} ${MONTHS_ID[t.getMonth()]} ${t.getFullYear()}</b><em>Shift ${sh}</em></div>
        <div class="jd-hero-names">${pair.map(n=>`<div class="jd-person"><i>${esc(inisial(n))}</i>${esc(n)}</div>`).join('')}</div></div>`;
    } else hero.innerHTML = `<div class="jd-hero off"><div class="jd-hero-l"><span>Hari ini</span><b>${HARI_ID[dow]} — tidak ada jadwal piket</b></div></div>`;
    // minggu-minggu dalam bulan (Senin–Jumat)
    const first=new Date(year,month,1), last=new Date(year,month+1,0);
    let mon = getMonday(first);
    let html = `<div class="jd-grid"><div class="jd-h"></div>${DAYS.map(d=>`<div class="jd-h">${d}</div>`).join('')}`;
    while(mon <= last){
      const sh = getShiftForDate(mon), fri = new Date(mon); fri.setDate(fri.getDate()+4);
      const adaHariBulanIni = [0,1,2,3,4].some(i=>{ const d=new Date(mon); d.setDate(d.getDate()+i); return d.getMonth()===month; });
      if(adaHariBulanIni){
        html += `<div class="jd-week"><span class="jd-shift">Shift ${sh}</span><span class="jd-range">${tglPendek(mon)} – ${tglPendek(fri)}</span></div>`;
        for(let i=0;i<5;i++){
          const d=new Date(mon); d.setDate(d.getDate()+i);
          const iso=isoDate(d), luar=d.getMonth()!==month, pair=SCHEDULE[sh][DAYS[i]];
          const kena = sorot && pair.includes(sorot);
          const cls = ['jd-day', luar?'out':'', iso===todayISO?'today':'', iso<todayISO?'past':'', kena?'hit':'', (sorot&&!kena)?'dim':''].filter(Boolean).join(' ');
          html += `<div class="${cls}"><div class="jd-date">${d.getDate()}${iso===todayISO?'<span>Hari ini</span>':''}</div>
            ${pair.map(n=>`<div class="jd-name ${n===sorot?'me':''}"><i>${esc(inisial(n))}</i><span>${esc(n)}</span></div>`).join('')}</div>`;
        }
      }
      mon = new Date(mon); mon.setDate(mon.getDate()+7);
    }
    wrap.innerHTML = html + '</div>';
  }
  document.getElementById('jPrev').addEventListener('click', ()=>{ cur=new Date(cur.getFullYear(), cur.getMonth()-1, 1); render(); });
  document.getElementById('jNext').addEventListener('click', ()=>{ cur=new Date(cur.getFullYear(), cur.getMonth()+1, 1); render(); });
  document.getElementById('jToday').addEventListener('click', ()=>{ const n=new Date(); cur=new Date(n.getFullYear(), n.getMonth(), 1); render(); });
  find.addEventListener('change', render);
  render();
}

function fmtJam(v){
  if(v===undefined || v===null || v==='') return '';
  const str = String(v).trim();
  let m = str.match(/^(\d{1,2})[:.](\d{2})(?![\d-])/);
  if(m) return `${m[1].padStart(2,'0')}:${m[2]}`;
  const d = new Date(str);
  if(!isNaN(d.getTime()) && /T\d{2}:\d{2}/.test(str)){
    // Google Sheets menyimpan jam sebagai tanggal 30-12-1899. Jika detik UTC = 0, jam asli = jam UTC; selain itu (zona LMT) pakai jam lokal.
    const utc = d.getUTCSeconds()===0;
    const h = utc ? d.getUTCHours() : d.getHours(), mi = utc ? d.getUTCMinutes() : d.getMinutes();
    return `${String(h).padStart(2,'0')}:${String(mi).padStart(2,'0')}`;
  }
  return str;
}
function normAbsen(r){ if(!r || typeof r!=='object') return r; return Object.assign({}, r, {mulai: fmtJam(r.mulai), selesai: fmtJam(r.selesai)}); }
async function loadAllRecords(){
  if(CONFIG.SHEET_WEBHOOK_URL){
    try{
      const sep = CONFIG.SHEET_WEBHOOK_URL.includes('?') ? '&' : '?';
      const res = await fetch(CONFIG.SHEET_WEBHOOK_URL + sep + 'action=list');
      const remote = await res.json();
      return Array.isArray(remote) ? remote.map(normAbsen) : remote; // spreadsheet jadi sumber kebenaran — baris yang dihapus di sana ikut hilang di sini
    }catch(e){ /* server tidak terjangkau, lanjut pakai cadangan lokal di bawah */ }
  }
  let local=[];
  try{ local = JSON.parse(localStorage.getItem('kpu_absensi_log')||'[]'); }catch(e){}
  return local.map(normAbsen);
}
function bindMonitor(){
  const monthSel=document.getElementById('mMonth');
  const yearSel=document.getElementById('mYear');
  const wrap=document.getElementById('mTableWrap');
  async function render(){
    wrap.innerHTML = '<p style="text-align:center;padding:4vh 0;">Memuat data...</p>';
    const month = parseInt(monthSel.value,10);
    const year = parseInt(yearSel.value,10);
    const [all, hadirAll] = await Promise.all([loadAllRecords(), loadHadir()]);
    window.__monData = {all, hadir: hadirAll};
    const daysInMonth = new Date(year, month+1, 0).getDate();
    let rows = '';
    for(let d=1; d<=daysInMonth; d++){
      const target = new Date(year, month, d);
      const dow = target.getDay(); // 0=Minggu ... 6=Sabtu
      if(dow<1 || dow>5) continue; // hanya hari kerja Senin-Jumat
      const hari = DAYS[dow-1];
      const shift = getShiftForDate(target);
      const dateStr = target.toLocaleDateString('id-ID');
      const match = all.filter(r=> dateKey(r.tanggal)===dateKey(dateStr)).pop();
      const defaultNames = (SCHEDULE[shift] && SCHEDULE[shift][hari]) ? SCHEDULE[shift][hari].join(', ') : '-';
      const namaTampil = (match && match.namaPetugas) ? match.namaPetugas : defaultNames;
      const status = match ? `<span class="badge ok">Sudah Absen</span>` : `<span class="badge no">Belum Absen</span>`;
      const gantiBadge = isTrueFlag(match && match.ganti) ? `<span class="badge warn">Ganti Petugas</span>` : '';

function isoDate(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function isoToDate(iso){ const [y,m,d]=String(iso).split('-').map(Number); return new Date(y,m-1,d); }
function tglPanjang(iso){ const dt=isoToDate(iso); return `${HARI_ID[dt.getDay()]}, ${dt.getDate()} ${MONTHS_ID[dt.getMonth()]} ${dt.getFullYear()}`; }
function tglSaja(iso){ const dt=isoToDate(iso); return `${dt.getDate()} ${MONTHS_ID[dt.getMonth()]} ${dt.getFullYear()}`; }
function jamSekarang(){ const n=new Date(); return `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pad3(n){ return String(n).padStart(3,'0'); }
// pelayanan online: nomor berawalan O (O01, O02, ...) dan/atau kolom kanal terisi
function isOnline(r){ return !!(r && (/^O\d+$/.test(String(r.noAntrian||'')) || String(r.kanal||'').trim())); }
function jenisTampil(r){ return String(r.jenisLayanan||'') + (isOnline(r) ? ` (Online${r.kanal ? ': '+r.kanal : ''})` : ''); }
// urutan tampil: nomor tiket (001...), lalu tanpa tiket (M01...), lalu online (O01...)
function urutNo(r){ const n=String(r.noAntrian||''), k=parseInt(n.replace(/^[A-Z]/i,''),10)||0; return /^O/i.test(n) ? 20000+k : /^M/i.test(n) ? 10000+k : k; }
function statusText(r){ if(!r.status) return '—'; return r.status==='Lainnya' && r.keterangan ? `Lainnya: ${r.keterangan}` : r.status; }
function loadScript(url){
  loadScript._c = loadScript._c || {};
  if(!loadScript._c[url]) loadScript._c[url] = new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=url; s.onload=res; s.onerror=()=>{ delete loadScript._c[url]; rej(new Error('Gagal memuat '+url)); }; document.head.appendChild(s); });
  return loadScript._c[url];
}
function downloadBlob(blob, name){
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

/* ---------- penyimpanan: spreadsheet (utama) + cadangan lokal ---------- */
function hadirLocal(){ try{ return JSON.parse(localStorage.getItem(HADIR_KEY)||'[]'); }catch(e){ return []; } }
function hadirSaveLocal(arr){ try{ localStorage.setItem(HADIR_KEY, JSON.stringify(arr)); }catch(e){} }
function hadirUpsertLocal(rec){
  const arr=hadirLocal(); const i=arr.findIndex(r=>r.id===rec.id);
  if(i>=0) arr[i]=Object.assign({}, arr[i], rec); else arr.push(rec);
  hadirSaveLocal(arr);
}
function normHadir(r){
  const o=Object.assign({}, r);
  o.tanggal = dateKey(o.tanggal) || String(o.tanggal||'');
  o.noAntrian = o.noAntrian ? pad3(parseInt(o.noAntrian,10)||o.noAntrian) : '';
  return o;
}
async function postHadir(rec){
  const clean=Object.assign({}, rec); delete clean._pending;
  const res = await fetch(CONFIG.HADIR_WEBHOOK_URL, {method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify({action:'upsert', record: clean})});
  const j = await res.json().catch(()=>null);
  return !!(res.ok && j && j.ok);
}
async function syncPendingHadir(){
  if(!CONFIG.HADIR_WEBHOOK_URL) return;
  for(const r of hadirLocal().filter(x=>x._pending)){
    try{ if(await postHadir(r)) hadirUpsertLocal({id:r.id, _pending:false}); }catch(e){}
  }
}
async function loadHadir(){
  const local = hadirLocal().map(normHadir);
  if(CONFIG.HADIR_WEBHOOK_URL){
    try{
      const sep = CONFIG.HADIR_WEBHOOK_URL.includes('?') ? '&' : '?';
      const res = await fetch(CONFIG.HADIR_WEBHOOK_URL + sep + 'action=list');
      const remote = await res.json();
      if(Array.isArray(remote)){
        const map = new Map(remote.map(r=>[String(r.id), normHadir(r)]));
        local.forEach(r=>{ if(r._pending) map.set(String(r.id), Object.assign({}, map.get(String(r.id))||{}, r)); });
        const merged=[...map.values()];
        hadirSaveLocal(merged);
        syncPendingHadir();
        return merged;
      }
    }catch(e){ /* server tidak terjangkau -> pakai cadangan lokal */ }
  }
  return local;
}
async function saveHadir(rec){
  rec._pending = true; hadirUpsertLocal(rec);
  if(!CONFIG.HADIR_WEBHOOK_URL) return 'local';
  try{ if(await postHadir(rec)){ hadirUpsertLocal({id:rec.id, _pending:false}); return 'server'; } }catch(e){}
  return 'local';
}
function petugasForDate(iso, absenAll){
  const match = (absenAll||[]).filter(r=>dateKey(r.tanggal)===iso).pop();
  if(match && match.namaPetugas) return {names: String(match.namaPetugas).split(/\s*,\s*/).filter(Boolean), absen: match, fromAbsen: true};
  const dt=isoToDate(iso), dow=dt.getDay();
  if(dow>=1 && dow<=5){ const sh=getShiftForDate(dt), pair=SCHEDULE[sh] && SCHEDULE[sh][DAYS[dow-1]]; if(pair) return {names: pair.slice(), absen:null, fromAbsen:false}; }
  return {names: [], absen:null, fromAbsen:false};
}

    downloadBlob(blob, `Laporan_Harian_Piket_PTSP_${L.iso}.docx`);
    toast('Laporan Word berhasil dibuat.');
  }catch(e){ console.warn(e); toast('Gagal membuat Word — periksa koneksi internet, atau gunakan tombol PDF.'); }
}
function outputPiketText(rows){
  if(!rows.length) return 'Tidak ada pemohon/penerima layanan pada hari ini.';
  return `Melayani ${rows.length} pemohon/penerima layanan:\n` + rows.map((r,i)=>`${i+1}. No. ${r.noAntrian} – ${jenisTampil(r)}: ${r.keperluan} (Status: ${r.status?statusText(r):'belum diisi'})`).join('\n');
}

const TABS = {

// label kolom (kartu di ponsel), baris hari ini, ringkasan monitoring, nama hari di jadwal
function ringkasMonitor(tb){
  const box = document.getElementById('monStats'); if(!box) return;
  const rows = [...tb.querySelectorAll('tbody tr')].filter(tr=>tr.children.length>2);
  const today = isoDate(new Date());
  const lalu = rows.filter(tr=>{ const sm=tr.querySelector('small'); return sm && dateKey(sm.textContent.trim()) <= today; });
  const sudah = rows.filter(tr=>tr.querySelector('.badge.ok')).length;
  const belumLalu = lalu.filter(tr=>!tr.querySelector('.badge.ok')).length;
  const pemohon = rows.reduce((s,tr)=>s+(parseInt((tr.children[6]||{}).textContent,10)||0),0);
  const pct = lalu.length ? Math.round(sudah/lalu.length*100) : 0;
  box.innerHTML = `<div class="stat"><small>Hari kerja</small><b>${rows.length}</b></div>
    <div class="stat ok"><small>Sudah absen</small><b>${sudah}</b><div class="bar"><i style="width:${Math.min(100,pct)}%"></i></div></div>
    <div class="stat no"><small>Belum absen (s.d. hari ini)</small><b>${belumLalu}</b></div>
    <div class="stat"><small>Total pemohon</small><b>${pemohon}</b></div>`;
}
new MutationObserver(()=>{
  document.querySelectorAll('.monitor-table').forEach(tb=>{
    if(tb.dataset.siap) return; tb.dataset.siap='1';
    const heads=[...tb.querySelectorAll('thead th')].map(th=>th.textContent.trim());
    const todayStr = new Date().toLocaleDateString('id-ID');
    tb.querySelectorAll('tbody tr').forEach(tr=>{
      [...tr.children].forEach((td,i)=>{ if(heads[i] && td.colSpan<2) td.dataset.label=heads[i]; });
      const sm=tr.querySelector('small');
      if(sm && sm.textContent.trim()===todayStr){ tr.classList.add('is-today'); if(innerWidth<=760) setTimeout(()=>tr.scrollIntoView({block:'center'}), 60); }
    });
    ringkasMonitor(tb);
  });
  document.querySelectorAll('.jd-grid').forEach(g=>{
    if(g.dataset.siap) return; g.dataset.siap='1';
    // urutan minggu sama dengan bindJadwal(): mulai Senin pertama dari tanggal 1 bulan yang tampil
    const t=(document.getElementById('jTitle')||{}).textContent||''; const bln=MONTHS_ID.findIndex(m=>t.startsWith(m)); const thn=parseInt(t.split(' ').pop(),10);
    const minggu=[];   // Senin dari setiap minggu yang ditampilkan (sama seperti di bindJadwal)
    if(bln>=0){ const last=new Date(thn,bln+1,0); let m=getMonday(new Date(thn,bln,1));
      while(m<=last){ if([0,1,2,3,4].some(k=>new Date(m.getFullYear(),m.getMonth(),m.getDate()+k).getMonth()===bln)) minggu.push(m); m=new Date(m.getFullYear(),m.getMonth(),m.getDate()+7); } }
    let mon=null, w=-1, i=0;
    [...g.children].forEach(c=>{
      if(c.classList.contains('jd-week')){ w++; mon=minggu[w]||null; i=0; }
      else if(c.classList.contains('jd-day')){
        const d = mon ? new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+i) : null;
        c.dataset.hari = DAYS[i]||'';
        if(d){ const tile=document.createElement('div'); tile.className='jd-tile';
          tile.innerHTML=`<small>${(DAYS[i]||'').slice(0,3)}</small><b>${d.getDate()}</b><small>${MONTHS_ID[d.getMonth()].slice(0,3)}</small>`;
          c.prepend(tile); }
        i++;
      }
    });
  });
}).observe(document.getElementById('modalBody'), {childList:true, subtree:true});

// ---------- status absensi hari ini (ringkas di header) ----------
function setState(cls, teks){ const el=document.getElementById('hState'); el.className='pill '+cls; el.textContent=teks; }
async function cekAbsenHariIni(){
  const n=new Date(), dow=n.getDay();
  if(dow<1 || dow>5){ setState('off', 'Libur piket'); return; }
  setState('wait', 'Memeriksa absensi…');
  try{
    const all = await loadAllRecords();
    const ada = Array.isArray(all) && all.some(r=>dateKey(r.tanggal)===isoDate(n));
    setState(ada ? 'ok' : 'no', ada ? 'Sudah absen hari ini' : 'Belum absen hari ini');
  }catch(e){ setState('wait', 'Status absen belum diketahui'); }
}
(function(){
  const n=new Date(), dow=n.getDay();
  document.getElementById('clkSub').textContent = `${HARI_ID[dow].slice(0,3)}, ${n.getDate()} ${MONTHS_ID[n.getMonth()].slice(0,3)}` + (dow>=1&&dow<=5 ? ` · Shift ${getShiftForDate(n)}` : '');
  const tick=()=>{ const d=new Date(); document.getElementById('clk').textContent=`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
  tick(); setInterval(tick, 15000);
  cekAbsenHariIni();
})();
